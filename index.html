<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Состав">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Состав</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --card:#151517; --card2:#232327; --sheet:#0f0f11;
  --line:rgba(255,255,255,.08);
  --text:#f4f4f6; --muted:rgba(235,235,245,.56); --muted2:rgba(235,235,245,.3);
  --accent:#4a8dff; --accent-soft:rgba(74,141,255,.15);
  --green:#32d74b; --orange:#ff9f0a; --red:#ff453a; --gold:#ffcc33;
  --font:'Onest',system-ui,sans-serif; --display:'Unbounded','Onest',sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --spring:cubic-bezier(.32,.72,0,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
html{overflow:hidden;overscroll-behavior:none}
/* lock the document so iOS can't rubber-band the whole screen; only inner lists scroll */
body{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- app shell ---------- */
#app{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);overflow:hidden;transition:transform .5s var(--spring),border-radius .5s var(--spring),filter .5s}
body.has-sheet #app{transform:scale(.94) translateY(calc(var(--sat) * .5));border-radius:18px;filter:brightness(.7)}
html.fit #app,html.fit .sheet-wrap,html.fit .alert-wrap,html.fit .lightbox{bottom:auto;height:var(--app-h)}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;padding-bottom:calc(120px + var(--sab));opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .28s ease,transform .35s var(--spring),visibility 0s .3s}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s ease,transform .35s var(--spring),visibility 0s}
.view::before{content:'';position:absolute;left:-20%;right:-20%;top:-120px;height:340px;background:radial-gradient(50% 50% at 50% 50%,rgba(74,141,255,.16),transparent 70%);pointer-events:none}
.view[data-v=events]::before{background:radial-gradient(50% 50% at 70% 50%,rgba(170,110,255,.15),transparent 70%)}
.view[data-v=more]::before{background:radial-gradient(50% 50% at 30% 50%,rgba(255,190,70,.12),transparent 70%)}

.nav{position:sticky;top:0;z-index:6;height:calc(var(--sat) + 56px);padding:var(--sat) 14px 0;display:flex;align-items:center;justify-content:flex-end;gap:8px;transition:background .25s,box-shadow .25s}
.nav.solid{background:rgba(0,0,0,.7);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 .5px 0 var(--line)}
.nav-title{position:absolute;left:50%;bottom:17px;transform:translateX(-50%) translateY(6px);font:600 16px var(--font);opacity:0;transition:.25s}
.nav.solid .nav-title{opacity:1;transform:translateX(-50%)}
.large{position:relative;display:flex;align-items:baseline;gap:10px;margin:-6px 20px 16px}
.large h1{font:600 31px/1.1 var(--display);letter-spacing:-.025em;margin:0}
.large .cnt{font:500 15px var(--display);color:var(--muted)}

.gbtn{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--text);background:rgba(255,255,255,.09);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 .5px 0 rgba(255,255,255,.18);transition:transform .2s,background .2s;flex:none}
.gbtn:active{transform:scale(.9)}
.gbtn.accent{background:var(--accent);color:#fff;box-shadow:inset 0 .5px 0 rgba(255,255,255,.35),0 6px 18px rgba(74,141,255,.35)}
.gbtn .i{width:22px;height:22px}

.search{position:relative;margin:0 16px 12px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;height:44px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font-size:16px}
.search input::placeholder{color:var(--muted2)}

.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 15px;border-radius:17px;background:var(--card);border:0;color:var(--muted);font:500 14px var(--font);transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--text);color:#000}

.seg{position:relative;margin:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:13px;padding:3px;height:40px}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:10px;background:var(--card2);box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform .4s var(--spring)}
.seg.r i{transform:translateX(100%)}
.seg button{position:relative;border:0;background:none;color:var(--muted);font:600 14px var(--font);transition:color .2s}
.seg button.on{color:var(--text)}

/* ---------- lists ---------- */
.letter{position:relative;padding:16px 32px 7px;font:600 13px var(--display);color:var(--muted)}
.lgroup{position:relative;margin:0 16px;background:var(--card);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:10px 12px 10px 14px;width:100%;background:none;border:0;color:inherit;text-align:left;font:inherit;position:relative;transition:background .15s}
.row:active{background:rgba(255,255,255,.05)}
.row+.row::before{content:'';position:absolute;top:0;left:78px;right:0;height:.5px;background:var(--line)}
.row-main{flex:1;min-width:0}
.row-title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.row-sub{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.row .chev{color:var(--muted2);width:18px;height:18px}
.pill-s{font:600 11.5px var(--font);padding:3px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.rate{font:600 12px var(--display);color:var(--gold);display:flex;align-items:center;gap:2px}
.rate svg{width:12px;height:12px;fill:currentColor}

.ava{width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;font:600 calc(var(--s) * .34) var(--display);color:#fff;overflow:hidden;letter-spacing:-.02em;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.ava img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- events ---------- */
.month{position:relative;padding:14px 32px 8px;font:600 13px var(--display);color:var(--muted);text-transform:capitalize}
.ev{position:relative;display:flex;gap:14px;padding:14px;margin:0 16px 10px;background:var(--card);border-radius:22px;width:calc(100% - 32px);border:0;color:inherit;text-align:left;font:inherit;transition:transform .2s}
.ev:active{transform:scale(.98)}
.ev-date{width:58px;flex:none;border-radius:16px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 0;align-self:flex-start}
.ev-date b{font:600 23px/1 var(--display)}
.ev-date span{font:700 11px var(--font);text-transform:uppercase;color:var(--accent);margin-top:5px;letter-spacing:.04em}
.ev-date i{font-style:normal;font-size:11px;color:var(--muted);margin-top:1px}
.ev-main{flex:1;min-width:0}
.ev-rel{font:700 11.5px var(--font);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin:1px 0 3px}
.ev-title{font-weight:600;font-size:17px;line-height:1.25;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev-sub{color:var(--muted);font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-foot{display:flex;align-items:center;gap:10px;margin-top:12px}
.bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c);transition:width .5s var(--spring)}
.ratio{font:600 13px var(--display);color:var(--c);white-space:nowrap}
.faces{display:flex;padding-left:8px}
.faces .ava{margin-left:-8px;box-shadow:0 0 0 2px var(--card)}
.ev.past{opacity:.72}

/* ---------- empty ---------- */
.empty{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 30px 10px}
.empty h3{font:600 20px var(--display);margin:8px 0 8px;letter-spacing:-.01em}
.empty p{color:var(--muted);margin:0 0 20px;line-height:1.45;font-size:15px}
.btn{height:50px;padding:0 24px;border-radius:25px;border:0;background:var(--accent);color:#fff;font:600 16px var(--font);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.sec{background:var(--card);color:var(--text)}
.btn-col{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px}

/* ---------- tab bar (liquid glass) ---------- */
.tabbar{position:absolute;left:50%;bottom:calc(10px + var(--sab));transform:translateX(-50%);width:min(calc(100% - 32px),400px);height:66px;border-radius:33px;padding:5px;display:grid;grid-template-columns:repeat(3,1fr);z-index:50;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,rgba(60,60,66,.5),rgba(34,34,38,.55));
  -webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.04),0 0 0 .5px rgba(255,255,255,.1),0 12px 34px rgba(0,0,0,.55);transition:transform .3s var(--spring)}
.tabbar.press{transform:translateX(-50%) scale(1.02)}
.pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 3);border-radius:28px;background:rgba(0,0,0,.6);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.05);transform:translateX(calc(var(--x,0) * 100%));transition:transform .55s cubic-bezier(.3,1.32,.5,1),background .25s,scale .3s var(--spring),box-shadow .25s}
.tabbar.dragging .pill{transition:background .25s,scale .3s var(--spring),box-shadow .25s;scale:1.12 1.08;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25),inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px rgba(0,0,0,.35)}
.tab{position:relative;border:0;background:none;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 11.5px var(--font);letter-spacing:.01em;transition:color .25s}
.tab svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tab svg .f{fill:currentColor;fill-opacity:0;transition:fill-opacity .25s}
.tab.on{color:var(--accent)}
.tab.on svg .f{fill-opacity:.28}
.tab.on svg{transform:translateY(-1px)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font:700 12.5px/22px var(--font);text-align:center;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.badge.show{transform:scale(1)}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:100}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .45s}
.sheet-wrap.open .sheet-backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 12px);max-width:560px;margin:0 auto;background:var(--sheet);border-radius:18px 18px 0 0;transform:translateY(104%);transition:transform .5s var(--spring);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.1)}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.open.behind .sheet{transform:scale(.94) translateY(-6px);filter:brightness(.75)}
.sheet-inner{display:flex;flex-direction:column;flex:1;min-height:0}
.grabber{position:absolute;top:6px;left:50%;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);transform:translateX(-50%);z-index:9}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 12px 8px;gap:8px;flex:none;touch-action:none;position:relative;z-index:8}
.sh-title{font:600 16px var(--font);text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-r{display:flex;gap:8px}
.txt-btn{background:none;border:0;color:var(--accent);font:500 16px var(--font);padding:8px 6px;min-width:72px;text-align:left}
.txt-btn.r{text-align:right}
.txt-btn.bold{font-weight:700}
.txt-btn:disabled{opacity:.3}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(40px + var(--sab));overscroll-behavior:none}

/* forms */
.glabel{padding:20px 32px 7px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.group{margin:0 16px;background:var(--card);border-radius:16px;overflow:hidden}
.field{display:flex;align-items:center;min-height:50px;padding:0 16px;position:relative;gap:12px}
.field+.field::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--line)}
.field>span{flex:none;font-size:16px}
.field input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font-size:16px;padding:14px 0}
.field input::placeholder,textarea::placeholder{color:var(--muted2)}
.field.lab input{text-align:right;color:rgba(244,244,246,.85)}
.field input[type=date],.field input[type=time]{-webkit-appearance:none;appearance:none;min-height:24px;display:flex;justify-content:flex-end}
.field input::-webkit-date-and-time-value{text-align:right}
textarea{display:block;width:100%;resize:none;padding:14px 16px;background:none;border:0;color:var(--text);font-size:16px;line-height:1.45;outline:none}
.photo-pick{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 6px}
.pp{width:108px;height:108px;border-radius:50%;background:var(--card2);display:grid;place-items:center;overflow:hidden;position:relative;color:var(--muted);cursor:pointer;transition:transform .2s}
.pp:active{transform:scale(.95)}
.pp img{width:100%;height:100%;object-fit:cover}
.pp .i{width:34px;height:34px;stroke-width:1.5}
.pp-links{display:flex;gap:18px}
.pp-links button{background:none;border:0;color:var(--accent);font:500 15px var(--font);padding:4px}
.pp-links button.del{color:var(--red)}
.tagpick{display:flex;flex-wrap:wrap;gap:8px;margin:0 16px}
.tchip{height:36px;padding:0 15px;border-radius:18px;background:var(--card);border:1px solid transparent;color:var(--text);font:500 14.5px var(--font);transition:all .2s}
.tchip.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(74,141,255,.45)}
.tadd{height:36px;width:150px;padding:0 14px;border-radius:18px;background:transparent;border:1px dashed rgba(255,255,255,.2);color:var(--text);font-size:16px;outline:none}
.stars{display:flex;gap:4px;padding:8px 12px}
.stars button{background:none;border:0;padding:4px;color:rgba(255,255,255,.14);transition:transform .25s cubic-bezier(.3,1.6,.5,1),color .2s}
.stars button svg{width:32px;height:32px;fill:currentColor;display:block}
.stars button.on{color:var(--gold)}
.stars button:active{transform:scale(.8)}
.stepper{display:flex;align-items:center;gap:6px;margin-left:auto}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--card2);color:var(--text);display:grid;place-items:center}
.stepper b{font:600 18px var(--display);min-width:40px;text-align:center}

/* detail */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px 18px}
.hero .ava{box-shadow:0 10px 40px rgba(0,0,0,.4);cursor:zoom-in}
.hero h2{font:600 25px/1.2 var(--display);margin:16px 0 6px;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:0;font-size:15px}
.hero .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.tag{font:500 13px var(--font);padding:5px 11px;border-radius:10px;background:var(--card2);color:var(--text)}
.hero .rate{margin-top:10px;font-size:14px}
.hero .rate svg{width:16px;height:16px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px}
.act{background:var(--card);border:0;border-radius:16px;padding:12px 4px 10px;color:var(--accent);display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12.5px var(--font);text-decoration:none;transition:transform .15s}
.act:active{transform:scale(.95)}
.act .i{width:22px;height:22px}
.act.off{opacity:.3;pointer-events:none}
.act.tg{color:#2aabee}
.act.wa{color:#25d366}
.actions-wrap{display:flex;flex-direction:column;gap:8px}
.edit-row{margin:0 16px;width:calc(100% - 32px);height:46px;border-radius:16px;border:0;background:var(--card);color:var(--accent);font:500 15px var(--font);display:flex;align-items:center;justify-content:center;gap:8px}
.edit-row .i{width:19px;height:19px}
.irow{padding:11px 16px;position:relative;display:block;color:inherit;text-decoration:none}
.irow+.irow::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--line)}
.irow small{display:block;font-size:13px;color:var(--muted)}
.irow div{font-size:16px;margin-top:2px;white-space:pre-wrap;word-break:break-word;line-height:1.4}
.irow a,.irow .lnk{color:var(--accent);text-decoration:none}
.danger-btn{display:block;margin:28px 16px 0;width:calc(100% - 32px);height:50px;border-radius:16px;border:0;background:var(--card);color:var(--red);font:500 16px var(--font)}
.mini-ev{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;position:relative}
.mini-ev+.mini-ev::before{content:'';position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--line)}
.mini-ev .d{font:600 13px var(--display);color:var(--accent);width:56px;flex:none}
.mini-ev .t{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* event detail */
.ev-hero{position:relative;margin:0 16px;padding:18px 18px 18px;border-radius:24px;overflow:hidden;background:radial-gradient(120% 130% at 100% 0%,rgba(74,141,255,.32),transparent 55%),radial-gradient(90% 120% at 0% 100%,rgba(170,110,255,.18),transparent 60%),var(--card)}
.kicker{font:700 11.5px var(--font);color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.ev-hero h2{font:600 22px/1.25 var(--display);margin:8px 84px 14px 0;letter-spacing:-.015em;word-break:break-word}
.meta{display:flex;align-items:flex-start;gap:9px;color:rgba(244,244,246,.86);font-size:15px;margin-top:7px;line-height:1.35}
.meta .i{width:18px;height:18px;color:var(--muted);margin-top:1px}
.ring{position:absolute;right:16px;top:18px;width:70px;height:70px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.09)}
.ring .fg{stroke:var(--c);transition:stroke-dashoffset .7s var(--spring)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 16px var(--display)}
.rbar{position:sticky;top:0;z-index:4;margin-top:8px;padding:12px 20px 10px;display:flex;align-items:center;gap:10px;background:rgba(15,15,17,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:background .2s}
.rbar h3,.sec-h h3{font:600 16px var(--display);margin:0;letter-spacing:-.01em}
.cnt-b{font:600 12.5px var(--display);color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);padding:4px 9px;border-radius:9px}
.rbar .hint{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right}
.rbar.over{background:rgba(74,141,255,.2)}
.zone{margin:2px 16px 0;padding:6px;border-radius:20px;background:var(--card);border:1.5px dashed transparent;transition:border-color .2s,background .2s,transform .25s var(--spring)}
body.dragging .zone{border-color:rgba(255,255,255,.14)}
.zone.over{border-color:var(--accent)!important;background:rgba(74,141,255,.1);transform:scale(1.01)}
.prow{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 6px;border-radius:15px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:opacity .2s,background .15s;cursor:grab;position:relative}
.prow:active{background:rgba(255,255,255,.04)}
.prow.dragging{opacity:.25}
.prow .grip{color:var(--muted2);width:18px;height:18px}
.prow .row-title{font-size:16px}
.prow .row-sub{font-size:13px}
.busy{color:var(--orange)!important}
.mini-btn{width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none;transition:transform .15s}
.mini-btn:active{transform:scale(.85)}
.mini-btn.rm{background:rgba(255,69,58,.14);color:var(--red)}
.mini-btn .i{width:18px;height:18px;stroke-width:2.4}
.slot{height:56px;border-radius:15px;border:1.5px dashed rgba(255,255,255,.11);display:flex;align-items:center;gap:12px;padding:0 10px;color:var(--muted2);font-size:14px;margin:4px 0}
.slot i{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.04);display:grid;place-items:center}
.over-note{font-size:13px;color:var(--orange);padding:6px 10px 4px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:24px 20px 10px}
.sec-h small{color:var(--muted);font-size:13px}
.tip{display:flex;align-items:center;gap:10px;margin:10px 16px 0;padding:10px 14px 10px 8px;border-radius:16px;background:rgba(255,204,51,.07);color:rgba(255,230,160,.9);font-size:13.5px;line-height:1.35}
.ghost{position:fixed;left:0;top:0;margin:0;z-index:1000;pointer-events:none;background:#2a2a2f;border-radius:16px;box-shadow:0 22px 50px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.15);transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.ghost.lift{transform:scale(1.05) rotate(-1.5deg)}
.ghost.drop{transition:transform .25s,opacity .25s;transform:scale(.5);opacity:0}

/* more tab */
.me{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px 20px}
.me h2{font:600 26px var(--display);margin:4px 0 4px;letter-spacing:-.02em}
.me p{color:var(--muted);margin:0;font-size:15px}
.stats{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}
.stat{background:var(--card);border-radius:20px;padding:14px 16px}
.stat b{display:block;font:600 28px/1.1 var(--display);letter-spacing:-.02em}
.stat small{color:var(--muted);font-size:13px}
.mrow{display:flex;align-items:center;gap:12px;padding:6px 14px 6px 10px;min-height:58px;width:100%;background:none;border:0;color:var(--text);font:500 16px var(--font);text-align:left;position:relative}
.mrow+.mrow::before{content:'';position:absolute;top:0;left:62px;right:0;height:.5px;background:var(--line)}
.mrow:active{background:rgba(255,255,255,.05)}
.mrow .lot{width:40px;height:40px;flex:none}
.mrow .tx{flex:1}
.mrow .tx small{display:block;font:400 13px var(--font);color:var(--muted);margin-top:1px}
.mrow.red{color:var(--red)}
.foot{text-align:center;color:var(--muted2);font-size:12px;padding:26px 0 0}

/* alerts / toast / lightbox */
.alert-wrap{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px}
.alert-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.alert{position:relative;width:min(300px,100%);background:rgba(36,36,40,.88);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:24px;text-align:center;overflow:hidden;transform:scale(1.15);opacity:0;transition:transform .4s cubic-bezier(.3,1.3,.5,1),opacity .25s;box-shadow:inset 0 .5px 0 rgba(255,255,255,.15)}
.alert-wrap.on .alert{transform:none;opacity:1}
.alert-wrap.on .alert-bg{opacity:1}
.alert .lot{width:86px;height:86px;margin:18px auto 0}
.alert-t{font:600 17px var(--font);padding:10px 20px 4px}
.alert-x{font-size:14px;color:var(--muted);padding:0 20px 18px;line-height:1.4}
.alert-btns{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid rgba(255,255,255,.12)}
.alert-btns button{height:50px;background:none;border:0;color:var(--accent);font:500 17px var(--font)}
.alert-btns button+button{border-left:.5px solid rgba(255,255,255,.12)}
.alert-btns .danger{color:var(--red);font-weight:600}
.alert-btns .strong{font-weight:600}
.toast{position:fixed;top:calc(var(--sat) + 10px);left:50%;transform:translate(-50%,-160%);z-index:400;background:rgba(40,40,44,.9);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);padding:8px 18px 8px 10px;border-radius:24px;font:500 15px var(--font);display:flex;gap:8px;align-items:center;transition:transform .5s cubic-bezier(.3,1.3,.5,1);box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 .5px 0 rgba(255,255,255,.15);max-width:calc(100% - 32px);pointer-events:none}
.toast.on{transform:translate(-50%,0)}
.toast .lot{width:36px;height:36px;flex:none}
.toast.plain{padding:12px 18px}
.lightbox{position:fixed;inset:0;z-index:350;background:rgba(0,0,0,.92);display:grid;place-items:center;opacity:0;transition:opacity .3s;padding:20px}
.lightbox.on{opacity:1}
.lightbox img{max-width:100%;max-height:80vh;border-radius:20px;transform:scale(.9);transition:transform .4s var(--spring)}
.lightbox.on img{transform:none}
.hap{position:fixed;left:-100px;top:-100px;opacity:0;pointer-events:none}

@media (min-width:700px){
  .view>*{max-width:640px;margin-left:auto;margin-right:auto}
  .view>.nav{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

<input type="file" id="import-file" accept=".json,application/json" class="hidden">

<script src="js/lottie.min.js"></script>
<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function plural(n,f){const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return f[2];if(b>1&&b<5)return f[1];if(b===1)return f[0];return f[2]}
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const parseD=iso=>new Date(iso+'T00:00:00');
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return isoOf(d)};
function fmtDate(iso,wd=true){if(!iso)return '';const d=parseD(iso);return `${d.getDate()} ${MONTHS[d.getMonth()]}${wd?', '+WD[d.getDay()]:''}`}
function shortDate(iso){const d=parseD(iso);return `${d.getDate()} ${MON[d.getMonth()]}`}
function relDay(iso){const diff=Math.round((parseD(iso)-parseD(todayISO()))/864e5);if(diff===0)return 'Сегодня';if(diff===1)return 'Завтра';if(diff===2)return 'Послезавтра';if(diff>2&&diff<7)return `Через ${diff} ${plural(diff,['день','дня','дней'])}`;return ''}
function ageOf(b){if(!b)return null;const d=parseD(b),n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a>=0&&a<120?a:null}
function ageStr(w){const a=ageOf(w.birth);return a==null?'':`${a} ${plural(a,['год','года','лет'])}`}
const fullName=w=>[w.firstName,w.lastName].filter(Boolean).join(' ')||'Без имени';
const timeStr=e=>e.start?(e.end?`${e.start}–${e.end}`:`с ${e.start}`):'';
const money=n=>Number(n).toLocaleString('ru-RU')+' ₽';
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}

const I={
  plus:'<svg viewBox="0 0 24 24" class="i"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg viewBox="0 0 24 24" class="i"><path d="M6 12h12"/></svg>',
  chev:'<svg viewBox="0 0 24 24" class="i chev"><path d="M9.5 6l6 6-6 6"/></svg>',
  x:'<svg viewBox="0 0 24 24" class="i"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
  phone:'<svg viewBox="0 0 24 24" class="i"><path d="M5.2 4h3l1.6 4-2 1.3a10.5 10.5 0 0 0 4.9 4.9l1.3-2 4 1.6v3a2 2 0 0 1-2.2 2A15.2 15.2 0 0 1 3.2 6.2 2 2 0 0 1 5.2 4z"/></svg>',
  tg:'<svg viewBox="0 0 24 24" class="i b"><path fill="currentColor" stroke="none" d="M21.4 4.3c.3-1.3-.9-2-1.9-1.6L2.9 9.1c-1.2.5-1.1 2.1.1 2.4l4.3 1.3 1.6 5.1c.3.9 1.5 1.2 2.2.5l2.3-2.2 4.4 3.3c.8.6 2 .1 2.2-.9zM9.3 14.4l-.4 3.3-1.2-4.1 9.6-6.1z"/></svg>',
  wa:'<svg viewBox="0 0 24 24" class="i b"><path fill="currentColor" stroke="none" d="M12 2.2A9.8 9.8 0 0 0 3.6 17l-1.4 4.8 5-1.3A9.8 9.8 0 1 0 12 2.2zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.7 2.7 0 0 0-.9 2c0 1.2.9 2.4 1 2.5.1.2 1.7 2.7 4.2 3.8 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.5-.2z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" class="i"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>',
  share:'<svg viewBox="0 0 24 24" class="i"><path d="M12 3.5v11M7.5 8L12 3.5 16.5 8M5 12.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5.5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" class="i"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  pin:'<svg viewBox="0 0 24 24" class="i"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  rub:'<svg viewBox="0 0 24 24" class="i"><path d="M9 20V4.5h4.8a4.2 4.2 0 0 1 0 8.4H6.5M6.5 16.5H14"/></svg>',
  user:'<svg viewBox="0 0 24 24" class="i"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c.8-3.6 3.8-5.6 7.5-5.6s6.7 2 7.5 5.6"/></svg>',
  users:'<svg viewBox="0 0 24 24" class="i"><circle cx="9" cy="8" r="3.4"/><path d="M3 19.5c.6-3.2 3-5 6-5s5.4 1.8 6 5M15.8 4.7a3.4 3.4 0 0 1 0 6.6M18.2 14.6c1.8.7 2.9 2.4 3.1 5"/></svg>',
  grip:'<svg viewBox="0 0 24 24" class="i grip"><path d="M9 6.5h.01M9 12h.01M9 17.5h.01M15 6.5h.01M15 12h.01M15 17.5h.01" stroke-width="3.2"/></svg>',
  camera:'<svg viewBox="0 0 24 24" class="i"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.5-2h5.6l1.5 2h1.2A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>',
  note:'<svg viewBox="0 0 24 24" class="i"><path d="M6 3.5h8.5l4 4V20.5H6zM14 3.5V8h4.5M9 13h6.5M9 16.5h4.5"/></svg>',
};
const GRADS=[['#ff9a62','#ff4e7a'],['#5cc8ff','#4a6bff'],['#7be38c','#1fa368'],['#c78cff','#7754ff'],['#ffd66b','#ff9628'],['#6be4ff','#2a9fc9'],['#ff7ab6','#c246ff'],['#9be15d','#00b39b']];
function avatar(w,size=48){
  if(w.photo)return `<div class="ava" style="--s:${size}px"><img src="${w.photo}" alt="" loading="lazy" draggable="false"></div>`;
  const g=GRADS[hash(w.id)%GRADS.length];
  const ini=((w.firstName||'?')[0]+((w.lastName||'')[0]||'')).toUpperCase();
  return `<div class="ava" style="--s:${size}px;background:linear-gradient(140deg,${g[0]},${g[1]})">${esc(ini)}</div>`;
}
/* messenger links: accept @username, phone number or a ready link */
const digits=v=>{let d=String(v||'').replace(/\D/g,'');if(d.length===11&&d[0]==='8')d='7'+d.slice(1);if(d.length===10&&d[0]==='9')d='7'+d;return d};
const isPhoneLike=v=>/^[+\d][\d\s()\-]{5,}$/.test(String(v||'').trim());
function tgLink(v){v=String(v||'').trim();if(!v)return '';if(/^(https?:\/\/|tg:)/i.test(v))return v;if(/^t\.me\//i.test(v))return 'https://'+v;if(isPhoneLike(v))return 'https://t.me/+'+digits(v);return 'https://t.me/'+encodeURIComponent(v.replace(/^@/,''))}
function tgLabel(v){v=String(v||'').trim();if(!v)return '';if(isPhoneLike(v))return v;const m=v.match(/t\.me\/([\w+]+)/i);if(m)return '@'+m[1].replace(/^\+/,'+');return /^https?:/i.test(v)?'Открыть чат':'@'+v.replace(/^@/,'')}
function waLink(v){v=String(v||'').trim();if(!v)return '';if(/^(https?:\/\/|whatsapp:)/i.test(v))return v;if(/^wa\.me\//i.test(v))return 'https://'+v;const d=digits(v);return d?'https://wa.me/'+d:''}
function waLabel(v){v=String(v||'').trim();return /^(https?:|wa\.me)/i.test(v)?'Открыть чат':v}
function stars(n){return n?`<span class="rate">${I.star}${n}</span>`:''}

/* ---------- haptics (iOS 18 switch trick + vibrate) ---------- */
function haptic(){try{if(navigator.vibrate)navigator.vibrate(8);else $('#hap-l').click()}catch(e){}}

/* ---------- lottie ---------- */
const LC={};
const lotData=n=>LC[n]||(LC[n]=fetch('anim/'+n+'.json').then(r=>{if(!r.ok)throw 0;return r.text()}));
const lot=(name,size,loop=false,extra='')=>`<div class="lot" data-lot="${name}" data-loop="${loop?1:0}" style="${size?`width:${size}px;height:${size}px;`:''}${extra}"></div>`;
function hydrate(root){
  if(!window.lottie)return;
  root.querySelectorAll('[data-lot]:not([data-on])').forEach(el=>{
    el.dataset.on='1';
    lotData(el.dataset.lot).then(t=>{
      if(!el.isConnected)return;
      el._a=lottie.loadAnimation({container:el,renderer:'svg',loop:el.dataset.loop==='1',autoplay:true,animationData:JSON.parse(t),rendererSettings:{preserveAspectRatio:'xMidYMid meet'}});
    }).catch(()=>{});
  });
}
function killLot(root){root.querySelectorAll('[data-lot]').forEach(el=>{if(el._a){el._a.destroy();el._a=null}})}
function setHTML(el,html){killLot(el);el.innerHTML=html;hydrate(el)}
function replay(el){const a=el&&el._a;if(a)a.goToAndPlay(0,true)}

/* ================= data ================= */
const KEY='sostav-data-v1';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.workers)&&Array.isArray(d.events))return d}catch(e){}return {workers:[],events:[]}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Не хватает памяти — удали пару фото')}refresh()}
const getW=id=>S.workers.find(w=>w.id===id);
const getE=id=>S.events.find(e=>e.id===id);
const isPast=e=>e.date<todayISO();
function status(e){const n=e.staff.length,need=Math.max(0,+e.need||0);const r=need?n/need:(n?1:0);const c=need&&n>=need?'var(--green)':n>0?'var(--orange)':'var(--red)';return {n,need,r:Math.min(1,r),c}}
function busyOn(wid,ev){return S.events.filter(o=>o.id!==ev.id&&o.date===ev.date&&o.staff.includes(wid))}
function eventsOf(wid){return S.events.filter(e=>e.staff.includes(wid)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))}
function nextEvent(wid){const t=todayISO();return eventsOf(wid).find(e=>e.date>=t)}

const TABS=['workers','events','more'];
const bar=$('#tabbar'),pill=$('#pill');
function setTab(t,first){
  const prev=UI.tab;UI.tab=t;saveUI();
  const i=TABS.indexOf(t);
  pill.style.setProperty('--x',i);
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $$('.view').forEach(v=>v.classList.toggle('on',v.dataset.v===t));
  if(!first){
    if(prev===t){const v=$(`.view[data-v=${t}]`);v.scrollTo({top:0,behavior:'smooth'})}
    else{haptic();pill.animate([{scale:'1 1'},{scale:'1.16 .88'},{scale:'.97 1.03'},{scale:'1 1'}],{duration:520,easing:'ease-out'});$$(`.view[data-v=${t}] .mrow [data-lot],.view[data-v=${t}] .me [data-lot]`).forEach(replay)}
  }
  syncLottiePlayback();
}
function syncLottiePlayback(){
  $$('.view').forEach(v=>{const on=v.classList.contains('on');v.querySelectorAll('[data-lot][data-loop="1"]').forEach(el=>{if(el._a){on&&!stack.length?el._a.play():el._a.pause()}})});
}
let pd=null;
bar.addEventListener('pointerdown',e=>{pd={x0:e.clientX,r:bar.getBoundingClientRect(),moved:false};try{bar.setPointerCapture(e.pointerId)}catch(_){};bar.classList.add('press')});
bar.addEventListener('pointermove',e=>{
  if(!pd)return;
  if(!pd.moved&&Math.abs(e.clientX-pd.x0)>6){pd.moved=true;bar.classList.add('dragging')}
  if(!pd.moved)return;
  const w=(pd.r.width-10)/3;let x=(e.clientX-pd.r.left-5-w/2)/w;x=Math.max(-.08,Math.min(2.08,x));
  pill.style.setProperty('--x',x);
  const near=Math.round(Math.max(0,Math.min(2,x)));
  $$('.tab').forEach((b,i)=>b.classList.toggle('on',i===near));
  if(near!==pd.near){if(pd.near!=null)haptic();pd.near=near}
});
function endBar(e,cancel){
  if(!pd)return;const r=pd.r,w=(r.width-10)/3;
  let i=cancel?TABS.indexOf(UI.tab):Math.floor((e.clientX-r.left-5)/w);i=Math.max(0,Math.min(2,i));
  bar.classList.remove('press','dragging');pd=null;setTab(TABS[i]);
}
bar.addEventListener('pointerup',e=>endBar(e));
bar.addEventListener('pointercancel',e=>endBar(e,true));

/* ================= sheets ================= */
const stack=[];
function openSheet(o){
  const el=document.createElement('div');el.className='sheet-wrap';
  el.innerHTML=`<div class="sheet-backdrop"></div><div class="sheet"><div class="grabber"></div><div class="sheet-inner"></div></div>`;
  document.body.appendChild(el);
  const sh={el,panel:$('.sheet',el),inner:$('.sheet-inner',el),static:!!o.static,guard:o.guard,data:{}};
  sh.draw=()=>{const sc=$('.sheet-body',sh.inner),top=sc?sc.scrollTop:0;const html=o.render(sh);if(html==null){sh.close();return}setHTML(sh.inner,html);const n=$('.sheet-body',sh.inner);if(n)n.scrollTop=top;o.mount&&o.mount(sh)};
  sh.close=()=>{if(sh.closed)return;sh.closed=true;el.classList.remove('open');stack.splice(stack.indexOf(sh),1);updStack();setTimeout(()=>{killLot(el);el.remove()},520);o.onClose&&o.onClose()};
  sh.requestClose=async()=>{if(sh.guard&&sh.guard()){const ok=await ask({title:'Закрыть без сохранения?',text:'Изменения не сохранятся.',ok:'Закрыть'});if(!ok)return}sh.close()};
  stack.push(sh);
  sh.draw();
  o.init&&o.init(sh);
  $('.sheet-backdrop',el).addEventListener('click',()=>sh.requestClose());
  bindSwipe(sh);
  el.offsetHeight;requestAnimationFrame(()=>el.classList.add('open'));
  updStack();
  return sh;
}
function updStack(){document.body.classList.toggle('has-sheet',stack.length>0);stack.forEach((s,i)=>s.el.classList.toggle('behind',i<stack.length-1));syncLottiePlayback()}
function bindSwipe(sh){
  const p=sh.panel;let s=null;
  p.addEventListener('pointerdown',e=>{if(!e.target.closest('.sheet-head,.grabber')||e.target.closest('button,input,a,textarea'))return;s={y:e.clientY,t:Date.now(),dy:0};try{p.setPointerCapture(e.pointerId)}catch(_){};p.style.transition='none'});
  p.addEventListener('pointermove',e=>{if(!s)return;const dy=e.clientY-s.y;s.dy=dy>0?dy:dy/6;p.style.transform=`translateY(${s.dy}px)`});
  const end=()=>{if(!s)return;const dy=s.dy,v=dy/Math.max(1,Date.now()-s.t);s=null;p.style.transition='';p.style.transform='';if(dy>130||(v>.55&&dy>40))sh.requestClose()};
  p.addEventListener('pointerup',end);p.addEventListener('pointercancel',end);
}
function sheetOf(node){return stack.find(s=>s.el.contains(node))}

/* ---------- alert / toast / lightbox ---------- */
function ask({title,text='',ok='Удалить',danger=true,anim='noentry',cancel='Отмена'}){
  return new Promise(res=>{
    const w=document.createElement('div');w.className='alert-wrap';
    w.innerHTML=`<div class="alert-bg"></div><div class="alert">${anim?lot(anim,86):''}<div class="alert-t">${esc(title)}</div><div class="alert-x">${esc(text)}</div><div class="alert-btns"><button data-v="0">${esc(cancel)}</button><button data-v="1" class="${danger?'danger':'strong'}">${esc(ok)}</button></div></div>`;
    document.body.appendChild(w);hydrate(w);
    requestAnimationFrame(()=>w.classList.add('on'));
    const done=v=>{w.classList.remove('on');setTimeout(()=>{killLot(w);w.remove()},300);res(v)};
    w.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)done(b.dataset.v==='1');else if(e.target.classList.contains('alert-bg'))done(false)});
  });
}
let toastT;
function toast(text,anim){
  let t=$('.toast');if(t){killLot(t);t.remove()}
  t=document.createElement('div');t.className='toast'+(anim?'':' plain');
  t.innerHTML=(anim?lot(anim,36):'')+`<span>${esc(text)}</span>`;
  document.body.appendChild(t);hydrate(t);
  requestAnimationFrame(()=>t.classList.add('on'));
  clearTimeout(toastT);toastT=setTimeout(()=>{t.classList.remove('on');setTimeout(()=>{killLot(t);t.remove()},500)},anim?2600:2000);
}
function lightbox(src){
  const l=document.createElement('div');l.className='lightbox';l.innerHTML=`<img src="${src}" alt="">`;
  document.body.appendChild(l);requestAnimationFrame(()=>l.classList.add('on'));
  l.addEventListener('click',()=>{l.classList.remove('on');setTimeout(()=>l.remove(),300)});
}

async function compressPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const S2=400,r=Math.min(img.naturalWidth,img.naturalHeight);
    const c=document.createElement('canvas');c.width=c.height=S2;
    const sx=(img.naturalWidth-r)/2,sy=Math.max(0,(img.naturalHeight-r)/2-(img.naturalHeight>img.naturalWidth?r*.12:0));
    c.getContext('2d').drawImage(img,sx,sy,r,r,0,0,S2,S2);
    return c.toDataURL('image/jpeg',.82);
  }finally{URL.revokeObjectURL(url)}
}

/* drag engine — long-press on touch, drag on mouse */
const D={active:false};
let suppressClickUntil=0;
/* block page drift: touches outside a scrollable list (or in a list with nothing to scroll) never move the screen */
let tsY=0;
document.addEventListener('touchstart',e=>{tsY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchmove',e=>{
  if(D.active){e.preventDefault();return}
  if(e.touches.length>1){e.preventDefault();return}
  const sc=e.target.closest('.view.on,.sheet-body,.chips,textarea');
  if(!sc){e.preventDefault();return}
  if(sc.classList.contains('chips'))return;
  const dy=e.touches[0].clientY-tsY,max=sc.scrollHeight-sc.clientHeight;
  if(max<=0||(dy>0&&sc.scrollTop<=0)||(dy<0&&sc.scrollTop>=max-1))e.preventDefault();
},{passive:false});
function initDrag(sh){
  const pick=t=>{const it=t.closest('[data-drag]');return it&&!t.closest('.mini-btn')&&!it.closest('.ghost')?it:null};
  sh.inner.addEventListener('touchstart',e=>{const it=pick(e.target);if(it&&e.touches.length===1)pre(it,e.touches[0].clientX,e.touches[0].clientY,true,sh)},{passive:true});
  sh.inner.addEventListener('mousedown',e=>{if(e.button)return;const it=pick(e.target);if(it){e.preventDefault();pre(it,e.clientX,e.clientY,false,sh)}});
  sh.inner.addEventListener('contextmenu',e=>{if(e.target.closest('[data-drag]'))e.preventDefault()});
}
function pre(it,x,y,touch,sh){
  const P={it,sx:x,sy:y,x,y,sh};let timer=0;
  const off=()=>{clearTimeout(timer);removeEventListener('touchmove',tm);removeEventListener('touchend',up);removeEventListener('touchcancel',up);removeEventListener('mousemove',mm);removeEventListener('mouseup',up)};
  const onMove=(cx,cy)=>{P.x=cx;P.y=cy;if(!D.active){const d=Math.hypot(cx-P.sx,cy-P.sy);if(touch){if(d>10)off()}else if(d>5)begin(P);return}dragMove(cx,cy)};
  const tm=e=>onMove(e.touches[0].clientX,e.touches[0].clientY);
  const mm=e=>onMove(e.clientX,e.clientY);
  const up=()=>{off();if(D.active)dragEnd()};
  if(touch){addEventListener('touchmove',tm,{passive:true});addEventListener('touchend',up);addEventListener('touchcancel',up);timer=setTimeout(()=>begin(P),260)}
  else{addEventListener('mousemove',mm);addEventListener('mouseup',up)}
}
function begin(P){
  if(D.active)return;
  const r=P.it.getBoundingClientRect();
  Object.assign(D,{active:true,P,ox:P.x-r.left,oy:P.y-r.top,x:P.x,y:P.y,hit:null,src:P.it.dataset.src});
  const g=P.it.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.translate=`${r.left}px ${r.top}px`;
  document.body.appendChild(g);D.g=g;requestAnimationFrame(()=>g.classList.add('lift'));
  P.it.classList.add('dragging');document.body.classList.add('dragging');
  D.zones=$$('[data-drop]',P.sh.inner).filter(z=>z.dataset.drop!==D.src);
  D.scroller=$('.sheet-body',P.sh.inner);
  const hint=$('.rbar .hint',P.sh.inner);if(hint&&D.src==='pool'){D.hintWas=hint.textContent;hint.textContent='Отпусти тут ↓'}
  haptic();dragMove(P.x,P.y);D.raf=requestAnimationFrame(autoScroll);
}
function dragMove(x,y){
  D.x=x;D.y=y;D.g.style.translate=`${x-D.ox}px ${y-D.oy}px`;
  let hit=null;for(const z of D.zones){const r=z.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom){hit=z;break}}
  if(hit!==D.hit){if(D.hit)D.hit.classList.remove('over');if(hit){hit.classList.add('over');haptic()}D.hit=hit}
}
function autoScroll(){
  if(!D.active)return;const sc=D.scroller;
  if(sc){const r=sc.getBoundingClientRect(),edge=90;let v=0;if(D.y<r.top+edge)v=-(r.top+edge-D.y)/edge*16;else if(D.y>r.bottom-edge)v=(D.y-(r.bottom-edge))/edge*16;if(v){sc.scrollTop+=v;dragMove(D.x,D.y)}}
  D.raf=requestAnimationFrame(autoScroll);
}
function dragEnd(){
  D.active=false;cancelAnimationFrame(D.raf);suppressClickUntil=Date.now()+450;
  const {g,hit,P}=D;document.body.classList.remove('dragging');if(hit)hit.classList.remove('over');
  const hint=$('.rbar .hint',P.sh.inner);if(hint&&D.hintWas!=null){hint.textContent=D.hintWas;D.hintWas=null}
  if(hit){
    g.classList.add('drop');setTimeout(()=>g.remove(),260);P.it.classList.remove('dragging');
    const wid=P.it.dataset.id,ev=P.it.dataset.ev;
    hit.dataset.drop==='roster'?assign(ev,wid):unassign(ev,wid);
  }else{
    const r=P.it.getBoundingClientRect();g.style.transition='translate .35s cubic-bezier(.3,1.2,.5,1),transform .3s';g.classList.remove('lift');g.style.translate=`${r.left}px ${r.top}px`;
    setTimeout(()=>{g.remove();P.it.classList.remove('dragging')},350);
  }
  D.hit=null;
}

/* ---------- share ---------- */
async function shareEvent(id){
  const e=getE(id);if(!e)return;
  const lines=[`🎉 ${e.title}`,`📅 ${fmtDate(e.date)}${timeStr(e)?' · '+timeStr(e):''}`];
  if(e.place)lines.push(`📍 ${e.place}`);
  if(e.pay)lines.push(`💰 ${money(e.pay)} за смену`);
  if(e.notes)lines.push(`📝 ${e.notes}`);
  lines.push('',`👥 Состав (${e.staff.length}/${e.need}):`);
  e.staff.map(getW).filter(Boolean).forEach((w,i)=>lines.push(`${i+1}. ${fullName(w)}${w.phone?' — '+w.phone:''}`));
  const text=lines.join('\n');
  if(navigator.share){try{await navigator.share({text});return}catch(err){if(err.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);toast('Скопировано — вставь в чат')}catch(err){toast('Не удалось скопировать')}
}

    ev('Фестиваль уличной еды',-6,'11:00','21:00','Парк Горького','Агентство «Вкус»',5,3500,'',[0,2,5,6,7]),
    ev('Выставка «Дизайн-неделя»',-14,'10:00','18:00','Гостиный двор','',3,3200,'',[1,3,9])]};
  save();toast('Пример загружен','cool');
}

/* ================= global clicks ================= */
document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.preventDefault();e.stopPropagation()}},true);
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  const lotEl=t.querySelector(':scope > [data-lot]');if(lotEl)replay(lotEl);
  switch(a){
    case 'add-worker':workerForm();break;
    case 'open-worker':workerDetail(id);break;
    case 'edit-worker':workerForm(getW(id));break;
    case 'zoom':{const w=getW(id);if(w&&w.photo)lightbox(w.photo);break}
    case 'del-worker':{const w=getW(id);if(!w)break;const n=eventsOf(id).length;
      if(await ask({title:`Удалить ${w.firstName}?`,text:n?`Человек пропадёт из базы и из ${n} ${plural(n,['ивента','ивентов','ивентов'])}.`:'Человек пропадёт из базы навсегда.'})){
        S.workers=S.workers.filter(x=>x.id!==id);S.events.forEach(ev=>ev.staff=ev.staff.filter(x=>x!==id));save();toast('Удалено')}break}
    case 'add-event':eventForm();break;
    case 'open-event':eventDetail(id);break;
    case 'edit-event':eventForm(getE(id));break;
    case 'del-event':{const ev=getE(id);if(!ev)break;if(await ask({title:'Удалить ивент?',text:`«${ev.title}» удалится вместе с составом.`})){S.events=S.events.filter(x=>x.id!==id);save();toast('Ивент удалён')}break}
    case 'assign':assign(t.dataset.ev,id);break;
    case 'unassign':unassign(t.dataset.ev,id);break;
    case 'share-event':shareEvent(id);break;
    case 'close':{const s=sheetOf(t);s&&s.requestClose();break}
    case 'seg':UI.seg=id;saveUI();haptic();renderEvents();break;
    case 'wtag':UI.wtag=id;haptic();renderWorkers();break;
    case 'demo':demo();break;
    case 'export':exportData();break;
    case 'import':$('#import-file').click();break;
    case 'install':infoSheet('phone','На экран «Домой»',[
      ['1','Открой ссылку на приложение в <b>Safari</b>'],['2','Нажми кнопку <b>«Поделиться»</b> внизу экрана'],['3','Выбери <b>«На экран „Домой“»</b> → «Добавить»'],['✓','Готово: «Состав» откроется как обычное приложение, без адресной строки, и будет работать без интернета']]
      .map(([n,t])=>`<div class="irow" style="display:flex;gap:14px;align-items:center"><b style="font:600 15px var(--display);color:var(--accent);width:18px">${n}</b><div style="margin:0">${t}</div></div>`).join(''));break;
    case 'tips':infoSheet('idea','Фишки',[
      ['Перетаскивание','В ивенте зажми человека на полсекунды и тащи в «Состав». Обратно — так же, в «Все люди».'],
      ['Нижняя панель','Её можно не только нажимать, но и тянуть пальцем — пузырь поедет за ним.'],
      ['Занятость','Если человек уже стоит на другом ивенте в тот же день — увидишь оранжевую пометку.'],
      ['Поделиться составом','Кнопка ↑ в ивенте собирает текст со списком и телефонами — сразу в Telegram.'],
      ['Копия данных','Всё хранится на телефоне. Раз в пару недель жми «Сохранить копию» — на всякий случай.']]
      .map(([h,t])=>`<div class="irow"><small style="color:var(--text);font-weight:600;font-size:15px">${h}</small><div style="color:var(--muted);font-size:14.5px">${t}</div></div>`).join(''));break;
    case 'wipe':if(await ask({title:'Удалить всё?',text:'Все люди и ивенты удалятся с этого устройства. Сначала лучше сохранить копию.',ok:'Удалить всё'})){S={workers:[],events:[]};save();toast('Всё удалено')}break;
  }
});

/* ================= boot ================= */
if(!TABS.includes(UI.tab))UI.tab='workers';
refresh();setTab(UI.tab,true);
requestAnimationFrame(()=>document.body.classList.add('ready'));
/* iOS home-screen bug: the viewport comes out shorter than the screen and leaves a black strip at the bottom.
   In standalone mode stretch the app to the real screen height. */
function fitScreen(){
  const de=document.documentElement,st=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  const portrait=innerHeight>=innerWidth,full=portrait?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
  const gap=full-innerHeight;
  if(st&&gap>2&&gap<140){de.style.setProperty('--app-h',full+'px');de.classList.add('fit')}
  else{de.classList.remove('fit')}
}
fitScreen();addEventListener('resize',fitScreen);addEventListener('orientationchange',()=>setTimeout(fitScreen,300));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
